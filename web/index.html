<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ssaju · 사주 · 성격 · 오늘의 운세 · 궁합</title>
  <meta name="description" content="생년월일시로 보는 사주 원국·성격, 오늘의 운세, 궁합. ssaju 엔진 + AI 해석." />
  <style>
    :root {
      --bg: #0f1115; --card: #171a21; --card2: #1e222b; --line: #2a2f3a;
      --text: #e8eaed; --muted: #9aa0aa; --accent: #c9a24b; --accent2: #6ea8fe;
      --good: #4bbf8a; --warn: #e0a13a; --love: #e0708a; --radius: 16px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f5f7; --card: #ffffff; --card2: #f7f8fa; --line: #e5e7eb;
        --text: #1a1d23; --muted: #6b7280; --accent: #a9812f; --accent2: #2f6bd8; --love: #c14d6b;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
      line-height: 1.5; -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
    header { text-align: center; margin-bottom: 18px; }
    header h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.5px; }
    header h1 .dot { color: var(--accent); }
    header p { color: var(--muted); margin: 0; font-size: 14px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tabs button {
      flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--card); color: var(--muted); font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .tabs button.on { background: var(--accent); color: #1a1207; border-color: var(--accent); }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
    .card.love { border-color: color-mix(in srgb, var(--love) 40%, var(--line)); }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--card2); color: var(--text); font-size: 16px; outline: none;
    }
    input:focus { border-color: var(--accent2); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .fld { margin-bottom: 10px; }
    .seg { display: flex; gap: 8px; margin-top: 10px; }
    .seg button {
      flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--card2); color: var(--muted); font-size: 14px; cursor: pointer;
    }
    .seg button.on { background: var(--accent); color: #1a1207; border-color: var(--accent); font-weight: 700; }
    .go {
      width: 100%; margin-top: 14px; padding: 15px; border: none; border-radius: 12px;
      background: var(--accent); color: #1a1207; font-size: 17px; font-weight: 800; cursor: pointer;
    }
    .go.love { background: var(--love); color: #fff; }
    .go:active { transform: translateY(1px); }

    .person-label { font-size: 13px; font-weight: 700; color: var(--accent); margin: 0 0 8px; }
    .person-label.b { color: var(--accent2); }
    .heart-div { text-align: center; color: var(--love); font-size: 20px; margin: 4px 0 12px; }

    .sec-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px; }
    .base { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
    .base b { color: var(--text); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    td.big { font-size: 20px; font-weight: 700; }
    .hanja { color: var(--accent); }

    .persona-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .persona-head .stem { font-size: 30px; font-weight: 800; color: var(--accent); }
    .persona-head .arch { font-size: 17px; font-weight: 700; }
    .persona-head .ko { color: var(--muted); font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .chip { background: var(--card2); border: 1px solid var(--line); color: var(--text); font-size: 12px; padding: 4px 10px; border-radius: 999px; }
    .desc { font-size: 14px; color: var(--text); margin: 8px 0; }
    .bars { margin: 12px 0; }
    .bar-row { display: grid; grid-template-columns: 42px 1fr 28px; align-items: center; gap: 8px; margin: 5px 0; font-size: 13px; }
    .bar-track { background: var(--card2); border-radius: 6px; height: 10px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent2); border-radius: 6px; }
    .bar-fill.dom { background: var(--accent); }
    .bar-row .n { text-align: right; color: var(--muted); }
    .lists { display: grid; gap: 12px; margin-top: 12px; }
    .lists h4 { margin: 0 0 6px; font-size: 13px; }
    .lists .good h4 { color: var(--good); }
    .lists .warn h4 { color: var(--warn); }
    .lists ul { margin: 0; padding-left: 18px; }
    .lists li { font-size: 13.5px; margin: 3px 0; }

    .ai-intro { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; }
    .ai-btn {
      width: 100%; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #b98d3a); color: #1a1207; font-size: 15px; font-weight: 800;
    }
    .ai-btn.love { background: linear-gradient(135deg, var(--love), #b8556f); color: #fff; }
    .ai-btn:disabled { opacity: .6; cursor: default; }
    .report { font-size: 14px; line-height: 1.7; }
    .report h4 { margin: 16px 0 6px; font-size: 14px; color: var(--accent); }
    .report h4:first-child { margin-top: 0; }
    .report p { margin: 6px 0; }
    .report ul { margin: 6px 0; padding-left: 18px; }
    .report li { margin: 3px 0; }
    .report strong { color: var(--text); }
    .ai-meta { margin-top: 12px; font-size: 11px; color: var(--muted); }
    .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(128,128,128,.3); border-top-color: var(--accent); border-radius: 50%; vertical-align: -2px; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

    .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mini .who { text-align: center; }
    .mini .who .nm { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .mini .who .dm { font-size: 26px; font-weight: 800; color: var(--accent); }
    .mini .who .gz { font-family: monospace; color: var(--muted); font-size: 13px; margin-top: 4px; letter-spacing: 1px; }

    .err { color: #e5484d; font-size: 14px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
    footer a { color: var(--accent2); text-decoration: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ssaju<span class="dot">.</span></h1>
      <p>사주 원국 · 성격 · 오늘의 운세 · 궁합</p>
    </header>

    <div class="tabs">
      <button id="tabSolo" class="on">내 사주</button>
      <button id="tabMatch">궁합</button>
    </div>

    <!-- ===== 내 사주 ===== -->
    <section id="viewSolo">
      <div class="card">
        <div class="fld"><label>이름 (선택)</label><input id="s_name" type="text" maxlength="20" placeholder="홍길동" /></div>
        <div class="grid">
          <div><label>년</label><input id="s_year" type="number" inputmode="numeric" placeholder="2001" /></div>
          <div><label>월</label><input id="s_month" type="number" inputmode="numeric" placeholder="11" /></div>
          <div><label>일</label><input id="s_day" type="number" inputmode="numeric" placeholder="3" /></div>
        </div>
        <div class="row2">
          <div><label>시 (모르면 비움)</label><input id="s_hour" type="number" inputmode="numeric" placeholder="14" /></div>
          <div><label>분</label><input id="s_minute" type="number" inputmode="numeric" placeholder="20" /></div>
        </div>
        <div class="seg" id="s_gender"><button data-v="남" class="on">남성</button><button data-v="여">여성</button></div>
        <div class="seg" id="s_cal"><button data-v="solar" class="on">양력</button><button data-v="lunar">음력</button></div>
        <button class="go" id="s_go">사주 보기</button>
      </div>
      <div id="soloResult"></div>
    </section>

    <!-- ===== 궁합 ===== -->
    <section id="viewMatch" hidden>
      <div class="card love">
        <p class="person-label">첫 번째 사람</p>
        <div class="fld"><label>이름</label><input id="a_name" type="text" maxlength="20" placeholder="나" /></div>
        <div class="grid">
          <div><label>년</label><input id="a_year" type="number" inputmode="numeric" placeholder="2001" /></div>
          <div><label>월</label><input id="a_month" type="number" inputmode="numeric" placeholder="11" /></div>
          <div><label>일</label><input id="a_day" type="number" inputmode="numeric" placeholder="3" /></div>
        </div>
        <div class="row2">
          <div><label>시 (모르면 비움)</label><input id="a_hour" type="number" inputmode="numeric" placeholder="14" /></div>
          <div><label>분</label><input id="a_minute" type="number" inputmode="numeric" placeholder="20" /></div>
        </div>
        <div class="seg" id="a_gender"><button data-v="남" class="on">남성</button><button data-v="여">여성</button></div>
        <div class="seg" id="a_cal"><button data-v="solar" class="on">양력</button><button data-v="lunar">음력</button></div>

        <div class="heart-div">♡</div>

        <p class="person-label b">두 번째 사람</p>
        <div class="fld"><label>이름</label><input id="b_name" type="text" maxlength="20" placeholder="상대" /></div>
        <div class="grid">
          <div><label>년</label><input id="b_year" type="number" inputmode="numeric" placeholder="1999" /></div>
          <div><label>월</label><input id="b_month" type="number" inputmode="numeric" placeholder="5" /></div>
          <div><label>일</label><input id="b_day" type="number" inputmode="numeric" placeholder="20" /></div>
        </div>
        <div class="row2">
          <div><label>시 (모르면 비움)</label><input id="b_hour" type="number" inputmode="numeric" placeholder="9" /></div>
          <div><label>분</label><input id="b_minute" type="number" inputmode="numeric" placeholder="0" /></div>
        </div>
        <div class="seg" id="b_gender"><button data-v="남">남성</button><button data-v="여" class="on">여성</button></div>
        <div class="seg" id="b_cal"><button data-v="solar" class="on">양력</button><button data-v="lunar">음력</button></div>

        <button class="go love" id="m_go">궁합 보기</button>
      </div>
      <div id="matchResult"></div>
    </section>

    <footer>
      <a href="https://github.com/rbencrbenc-arch/ssaju" target="_blank" rel="noopener">ssaju</a> 엔진 · 계산은 브라우저 · 해석은 AI · 참고용
    </footer>
  </div>

  <script type="module">
    import { calculateSaju } from "./ssaju.mjs";

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

    // segmented controls: store chosen value on the element's dataset
    document.querySelectorAll(".seg").forEach((seg) => {
      const init = seg.querySelector("button.on") || seg.querySelector("button");
      seg.dataset.value = init.dataset.v;
      seg.addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        [...seg.children].forEach((c) => c.classList.remove("on"));
        b.classList.add("on"); seg.dataset.value = b.dataset.v;
      });
    });

    // tabs
    function showTab(which) {
      const solo = which === "solo";
      $("tabSolo").classList.toggle("on", solo);
      $("tabMatch").classList.toggle("on", !solo);
      $("viewSolo").hidden = !solo;
      $("viewMatch").hidden = solo;
    }
    $("tabSolo").addEventListener("click", () => showTab("solo"));
    $("tabMatch").addEventListener("click", () => showTab("match"));

    // read one person's form by id prefix; returns { input, name } or null
    function readPerson(p) {
      const num = (k) => { const v = $(`${p}_${k}`).value.trim(); return v === "" ? undefined : Number(v); };
      const year = num("year"), month = num("month"), day = num("day");
      if (!year || !month || !day) return null;
      return {
        name: $(`${p}_name`).value.trim(),
        input: {
          year, month, day, hour: num("hour"), minute: num("minute"),
          gender: $(`${p}_gender`).dataset.value,
          calendar: $(`${p}_cal`).dataset.value,
        },
      };
    }

    // ---- lightweight markdown -> html ----
    function mdToHtml(md) {
      const lines = String(md).split("\n");
      let html = "", inList = false;
      const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      for (const raw of lines) {
        const line = raw.trimEnd();
        if (/^#{1,6}\s/.test(line)) {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<h4>${inline(line.replace(/^#{1,6}\s/, ""))}</h4>`;
        } else if (/^[-*]\s/.test(line)) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${inline(line.replace(/^[-*]\s/, ""))}</li>`;
        } else if (line === "") {
          if (inList) { html += "</ul>"; inList = false; }
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<p>${inline(line)}</p>`;
        }
      }
      if (inList) html += "</ul>";
      return html;
    }

    // ---- AI report fetch (shared) ----
    async function generateReport(payload, bodyEl, loadingMsg, loveClass) {
      const cls = loveClass ? " love" : "";
      bodyEl.innerHTML = `<p class="ai-intro"><span class="spinner"></span> ${esc(loadingMsg)}</p>`;
      const retry = () => generateReport(payload, bodyEl, loadingMsg, loveClass);
      try {
        const resp = await fetch("/api/report", {
          method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          const msg = data.message || `요청 실패 (${resp.status})`;
          bodyEl.innerHTML = `<p class="err">${esc(msg)}</p>` +
            (data.error === "no_key" ? `<p class="ai-intro">배포 후 Vercel → Settings → Environment Variables 에 <b>GEMINI_API_KEY</b>를 넣으면 작동합니다.</p>` : "") +
            `<button class="ai-btn${cls}" data-retry style="margin-top:10px">다시 시도</button>`;
        } else {
          bodyEl.innerHTML = `<div class="report">${mdToHtml(data.text || "")}</div>` +
            `<p class="ai-meta">AI 생성 · ${esc(data.model || "")} · 참고용</p>`;
        }
      } catch (e) {
        bodyEl.innerHTML = `<p class="err">네트워크 오류: ${esc(e && e.message || e)}</p>` +
          `<button class="ai-btn${cls}" data-retry style="margin-top:10px">다시 시도</button>`;
      }
      const rb = bodyEl.querySelector("[data-retry]");
      if (rb) rb.addEventListener("click", retry);
    }

    function pillarTable(p) {
      const cols = ["hour", "day", "month", "year"];
      const head = ["시주", "일주", "월주", "연주"];
      const th = head.map((h) => `<th>${h}</th>`).join("");
      const stemRow = cols.map((k) => `<td class="big"><span class="hanja">${esc(p[k].stem)}</span><div style="font-size:11px;color:var(--muted)">${esc(p[k].stemKo)}${esc(p[k].element.stem)}</div></td>`).join("");
      const branchRow = cols.map((k) => `<td class="big"><span class="hanja">${esc(p[k].branch)}</span><div style="font-size:11px;color:var(--muted)">${esc(p[k].branchKo)}${esc(p[k].element.branch)}</div></td>`).join("");
      return `<table><thead><tr><th></th>${th}</tr></thead><tbody>
        <tr><th>천간</th>${stemRow}</tr><tr><th>지지</th>${branchRow}</tr></tbody></table>`;
    }
    function bars(dist, dominant) {
      const order = ["비겁", "식상", "재성", "관성", "인성"];
      const max = Math.max(1, ...order.map((k) => dist[k]));
      return `<div class="bars">` + order.map((k) => {
        const w = Math.round((dist[k] / max) * 100);
        return `<div class="bar-row"><span>${k}</span><div class="bar-track"><div class="bar-fill ${k === dominant ? "dom" : ""}" style="width:${w}%"></div></div><span class="n">${dist[k]}</span></div>`;
      }).join("") + `</div>`;
    }
    function elementBars(fe) {
      const order = ["목", "화", "토", "금", "수"];
      const max = Math.max(1, ...order.map((k) => fe[k] || 0));
      return `<div class="bars">` + order.map((k) => {
        const v = fe[k] || 0, w = Math.round((v / max) * 100);
        return `<div class="bar-row"><span>${k}</span><div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div><span class="n">${v}</span></div>`;
      }).join("") + `</div>`;
    }

    // ---- 내 사주 ----
    function renderSolo(r, name) {
      const a = r.advanced, p = a.personality, dm = p.dayMaster, i = r.input;
      const strengthKo = a.dayStrength.strength === "strong" ? "신강" : a.dayStrength.strength === "weak" ? "신약" : "중화";
      const hello = name ? `${esc(name)}님 · ` : "";
      $("soloResult").innerHTML = `
        <div class="card">
          <p class="sec-title">기본 정보</p>
          <p class="base"><b>${hello}${i.year}.${i.month}.${i.day} ${String(i.hour).padStart(2,"0")}:${String(i.minute).padStart(2,"0")}</b> · ${i.gender==="남"?"남성":"여성"} · ${i.calendar==="solar"?"양력":"음력"} · 만 ${r.currentAge}세</p>
          <p class="base">일간 <b class="hanja">${esc(r.dayStem)}</b> · ${strengthKo}(${a.dayStrength.score}) · ${esc(a.geukguk)} · 용신 ${a.yongsin.join(", ")||"-"}</p>
        </div>
        <div class="card"><p class="sec-title">원국 (사주 4주)</p>${pillarTable(r.pillarDetails)}</div>
        <div class="card">
          <p class="sec-title">성격</p>
          <div class="persona-head"><span class="stem">${esc(dm.stem)}</span><span class="arch">${esc(dm.archetype)}</span><span class="ko">${esc(dm.stemKo)}${esc(dm.element)} · ${dm.yinYang}</span></div>
          <div class="chips">${dm.keywords.map((k)=>`<span class="chip">${esc(k)}</span>`).join("")}</div>
          <p class="desc">${esc(dm.description)}</p>
          <p class="base" style="margin-top:14px">대표 기운 · <b>${esc(p.tenGodProfile.dominant)}</b></p>
          ${bars(p.tenGodProfile.distribution, p.tenGodProfile.dominant)}
          <p class="desc" style="color:var(--muted)">${esc(p.temperament.description)}</p>
          <div class="lists">
            <div class="good"><h4>✔ 강점</h4><ul>${p.strengths.map((s)=>`<li>${esc(s)}</li>`).join("")}</ul></div>
            <div class="warn"><h4>! 주의</h4><ul>${p.cautions.map((s)=>`<li>${esc(s)}</li>`).join("")}</ul></div>
          </div>
        </div>
        <div class="card"><p class="sec-title">AI 성격 리포트</p>
          <div id="soloPersonaBody"><p class="ai-intro">계산 결과를 바탕으로 AI가 당신을 <b>사람 말로</b> 풀어드립니다.</p>
          <button class="ai-btn" id="soloPersonaBtn">✦ AI 성격 풀이 보기</button></div></div>
        <div class="card"><p class="sec-title">오늘의 운세 · ${esc(r.reference.now.split(" ")[0])}</p>
          <div id="soloTodayBody"><p class="ai-intro">오늘 일진과 원국의 흐름을 AI가 짚어드려요.</p>
          <button class="ai-btn" id="soloTodayBtn">☀ 오늘의 운세 보기</button></div></div>
        <div class="card"><p class="sec-title">오행 분포</p>${elementBars(r.fiveElements)}</div>
        <div class="card">
          <details><summary style="cursor:pointer;color:var(--muted);font-size:13px">전체 리포트 (Markdown)</summary><pre style="white-space:pre-wrap;word-break:break-word;font-size:12.5px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px">${esc(r.toMarkdown())}</pre></details>
        </div>`;
      const compact = r.toCompact();
      $("soloPersonaBtn").addEventListener("click", () =>
        generateReport({ topic: "personality", name, compact }, $("soloPersonaBody"), "AI가 성격을 풀고 있어요… (10초쯤)", false));
      $("soloTodayBtn").addEventListener("click", () =>
        generateReport({ topic: "today", name, compact }, $("soloTodayBody"), "오늘의 운세를 보는 중… (10초쯤)", false));
      $("soloResult").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    $("s_go").addEventListener("click", () => {
      const person = readPerson("s");
      if (!person) { $("soloResult").innerHTML = `<div class="card"><p class="err">년/월/일을 모두 입력해 주세요.</p></div>`; return; }
      try { renderSolo(calculateSaju(person.input), person.name); }
      catch (e) { $("soloResult").innerHTML = `<div class="card"><p class="err">계산 오류: ${esc(e && e.message || e)}</p></div>`; }
    });

    // ---- 궁합 ----
    function miniWho(r, name, cls) {
      return `<div class="who"><div class="nm ${cls}">${esc(name || "-")}</div>
        <div class="dm">${esc(r.dayStem)}</div>
        <div class="gz">${esc(r.pillars.year)} ${esc(r.pillars.month)} ${esc(r.pillars.day)} ${esc(r.pillars.hour)}</div></div>`;
    }
    function renderMatch(rA, nameA, rB, nameB) {
      $("matchResult").innerHTML = `
        <div class="card"><p class="sec-title">원국 비교</p>
          <div class="mini">${miniWho(rA, nameA, "")}${miniWho(rB, nameB, "b")}</div></div>
        <div class="card love"><p class="sec-title">AI 궁합 리포트</p>
          <div id="matchAiBody"><p class="ai-intro">두 사람의 사주로 <b>궁합 점수와 조언</b>을 AI가 풀어드립니다.</p>
          <button class="ai-btn love" id="matchAiBtn">♡ 궁합 보기</button></div></div>`;
      $("matchAiBtn").addEventListener("click", () =>
        generateReport({
          topic: "match",
          nameA: nameA || "첫 번째", compactA: rA.toCompact(),
          nameB: nameB || "두 번째", compactB: rB.toCompact(),
        }, $("matchAiBody"), "두 사람의 궁합을 보는 중… (12초쯤)", true));
      $("matchResult").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    $("m_go").addEventListener("click", () => {
      const A = readPerson("a"), B = readPerson("b");
      if (!A || !B) { $("matchResult").innerHTML = `<div class="card"><p class="err">두 사람의 년/월/일을 모두 입력해 주세요.</p></div>`; return; }
      try { renderMatch(calculateSaju(A.input), A.name, calculateSaju(B.input), B.name); }
      catch (e) { $("matchResult").innerHTML = `<div class="card"><p class="err">계산 오류: ${esc(e && e.message || e)}</p></div>`; }
    });
  </script>
</body>
</html>
